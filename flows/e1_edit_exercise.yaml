appId: com.migul.treningsprogram
---
# E1 criterion 1 — EDIT a planned exercise's sets/reps/weight/notes on the Program tab.
# Pre-state (seeded): today (Wed, day 3) plan = [Bench Press 3x8-10 @60, Squat 5x5 @100, Barbell Row 4x8 @70].
# Edit dialog fields are unlabeled stacked EditTexts in order: Sets, Reps, Weight, Notes.
# We target each field by its PREFILLED text (sets="3", reps="8-10", weight="60", notes empty).
- launchApp:
    stopApp: true
- tapOn:
    id: "programFragment"
- assertVisible:
    id: "layout_exercises"
# Program tab opens on TODAY (Wed). Confirm the seeded Bench Press card + its current chips.
- assertVisible:
    text: "Bench Press"
- assertVisible:
    text: "3 sets"
- assertVisible:
    text: "8-10 reps"
- assertVisible:
    text: "60 kg"
- takeScreenshot: e1_edit_before
# Open the Edit dialog on the first card (Bench Press is index 0, its Edit button is the first).
- tapOn:
    id: "btn_edit_exercise"
    index: 0
- assertVisible:
    text: "Edit Bench Press"
- takeScreenshot: e1_edit_dialog
# Change SETS 3 -> 5 (field prefilled with "3")
- tapOn: "3"
- eraseText
- inputText: "5"
- hideKeyboard
# Change REPS "8-10" -> "6" (field prefilled with "8-10")
- tapOn: "8-10"
- eraseText
- inputText: "6"
- hideKeyboard
# Change WEIGHT "60" -> "65" (field prefilled with "60")
- tapOn: "60"
- eraseText
- inputText: "65"
- hideKeyboard
# Add NOTES into the (empty) notes field. Target by hint label proximity is unreliable; tap the
# last empty field via its hint is not available, so tap the Notes label is not tappable.
# Instead target the notes field by tapping just below the weight field is fragile — skip notes
# typing here and verify notes separately is not needed: type notes by tapping the notes EditText
# which is the only remaining empty field. We tap on the dialog area for notes by its absence of text:
# use the "Notes (optional)" label proximity — Maestro can tap the field after the label text.
- tapOn:
    below:
      text: "Notes (optional)"
- inputText: "leg day note"
- hideKeyboard
- tapOn:
    text: "Save"
# Card must now reflect the new values.
- assertVisible:
    text: "Bench Press"
- assertVisible:
    text: "5 sets"
- assertVisible:
    text: "6 reps"
- assertVisible:
    text: "65 kg"
- assertVisible:
    text: "leg day note"
- takeScreenshot: e1_edit_after
